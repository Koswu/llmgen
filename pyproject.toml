[tool.poetry]
name = "llmgen"
version = "0.5.0"
description = "Effortlessly generate LLM APIs by simply defining input and output schemas."
authors = ["koswu <koswu@outlook.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/Koswu/llmgen"
repository = "https://github.com/Koswu/llmgen"
keywords = ["llm", "openai", "pydantic", "schema", "api", "generation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[tool.poetry.dependencies]
python = ">=3.10"
pydantic = "^2.8.2"
pydantic-ai = ">=0.0.14"
typing-extensions = "^4.12.2"
docstring-parser = "^0.16"

[tool.poetry.group.dev.dependencies]
ipython = "^8"
pydantic-settings = "^2.4.0"
pytest = "^8.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
